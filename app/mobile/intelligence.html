<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>AI 社交安全中枢</title><style>body{margin:0;background:#f4f5f7;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding-bottom:90px}.top{position:sticky;top:0;background:#f4f5f7ee;backdrop-filter:blur(12px);padding:16px;border-bottom:1px solid #e5e7eb;z-index:5}.screen{display:none;padding:14px}.screen.on{display:block}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 4px 16px #1118270d}.hero{background:#111827;color:#fff}.muted{color:#6b7280;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button,input,textarea{font:inherit}button{border:0;border-radius:13px;padding:12px;background:#111827;color:white;font-weight:700}button.secondary{background:#eef1f5;color:#111827}.input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:13px;margin-top:8px}.item{padding:11px;border-radius:13px;background:#f8fafc;border:1px solid #edf0f4;margin-top:8px}.danger{background:#fff5f5;border-color:#fecaca}.success{background:#f0fdf4;border-color:#bbf7d0}.warn{background:#fffbeb;border-color:#fde68a}.metric{font-size:28px;font-weight:800}.transcript{background:#0f172a;color:#e2e8f0;min-height:220px;border-radius:14px;padding:12px;white-space:pre-wrap;line-height:1.7}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #e5e7eb;z-index:8}.nav button{background:none;color:#6b7280;padding:5px;font-size:11px}.nav button.on{color:#111827}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:999px;display:none;z-index:10}</style></head><body><div class="wrap"><header class="top"><h2 style="margin:0">AI 社交安全中枢</h2><div class="muted">沟通记录 · 防骗预警 · 声纹辅助 · 关系评估 · 决策建议</div></header>
<section id="home" class="screen on"><div class="card hero"><h2>重要沟通，留下依据</h2><p>把聊天、会议、社交对象和风险信号统一沉淀，自动给出下一步建议。</p></div><div class="grid"><div class="card"><div class="muted">待处理风险</div><div id="riskN" class="metric">0</div></div><div class="card"><div class="muted">待跟进关系</div><div id="followN" class="metric">0</div></div></div><div class="actions"><button onclick="go('chat')">聊天防骗</button><button onclick="go('meeting')">会议记录</button><button class="secondary" onclick="go('people')">关系档案</button><button class="secondary" onclick="go('voice')">声纹辅助</button></div><div class="card"><h3>今日决策简报</h3><div id="brief"></div></div></section>
<section id="chat" class="screen"><div class="card"><h2 style="margin-top:0">社交对话防骗预警</h2><div class="muted">粘贴对方的聊天文字，系统会归档并检查可疑信号。</div><input id="chatName" class="input" placeholder="沟通对象姓名（可选）"><textarea id="chatText" class="input" rows="7" placeholder="粘贴聊天内容……"></textarea><button style="width:100%;margin-top:8px" onclick="scanChat()">检查风险并记录沟通</button></div><div id="chatResult"></div><div class="card"><h3>自动决策建议</h3><div id="chatAdvice" class="muted">完成一次检查后显示。</div></div></section>
<section id="meeting" class="screen"><div class="card"><h2 style="margin-top:0">会议实时记录与总结</h2><div id="mic" class="muted">准备开始</div><div id="tx" class="transcript" style="margin-top:8px">点击开始记录。</div><textarea id="manual" class="input" rows="6" placeholder="语音识别不可用时输入会议内容"></textarea><div class="actions" style="margin-top:8px"><button onclick="toggleMic()">开始/停止记录</button><button class="secondary" onclick="clearMeeting()">清空</button></div><button style="width:100%;margin-top:8px" onclick="saveMeeting()">保存并自动总结</button></div><div id="meetingResult"></div></section>
<section id="people" class="screen"><div class="card"><h2 style="margin-top:0">社交对象与关系评估</h2><input id="personQ" class="input" placeholder="搜索姓名 / 关系"><button style="margin-top:8px" onclick="loadPeople()">搜索</button><div id="people"></div></div><div id="profile"></div></section>
<section id="voice" class="screen"><div class="card"><h2 style="margin-top:0">声纹辅助识别</h2><p class="muted">仅在本人知情同意后录入。声纹特征默认留在本机浏览器，只做辅助匹配，不用于身份认证。</p><input id="voiceName" class="input" placeholder="授权对象姓名"><div class="actions" style="margin-top:8px"><button onclick="enrollVoice()">录入授权样本</button><button class="secondary" onclick="matchVoice()">识别当前说话人</button></div><div id="voiceState" class="card warn">暂无样本。</div></div><div class="card"><h3>本机已授权样本</h3><div id="voices"></div></div></section>
<nav class="nav"><button id="n-home" class="on" onclick="go('home')">⌂<br>首页</button><button id="n-chat" onclick="go('chat')">⚠<br>防骗</button><button id="n-meeting" onclick="go('meeting')">◉<br>会议</button><button id="n-people" onclick="go('people')">♧<br>关系</button><button id="n-voice" onclick="go('voice')">◍<br>声纹</button></nav><div id="toast" class="toast"></div></div>
<script>const token=sessionStorage.getItem('health_token')||sessionStorage.getItem('access_token')||'';const H=()=>({'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})});let rec=null,recording=false,meetingText='',meetingId=null;async function api(u,o={}){const r=await fetch(u,{...o,headers:{...H(),...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'请求失败');return d}function esc(s){return String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.id==='n-'+id));if(id==='people')loadPeople();if(id==='voice')renderVoices()}async function briefing(){try{const d=await api('/api/social/briefing');riskN.textContent=d.risk_alerts.length;followN.textContent=d.relationship_reminders.length;brief.innerHTML=[...d.risk_alerts.slice(0,3).map(x=>`<div class="item danger"><b>防骗预警 · ${esc(x.severity)}</b><div>${esc(x.category)}</div><div class="muted">${esc(x.advice)}</div></div>`),...d.relationship_reminders.slice(0,3).map(x=>`<div class="item"><b>${esc(x.person_name)}</b><div>${esc(x.summary)}</div><div class="muted">${x.overdue?'已逾期':'待跟进'}</div></div>`),...d.recent_meetings.slice(0,2).map(x=>`<div class="item"><b>会议 · ${esc(x.title)}</b><div>${esc(x.summary)}</div></div>`)].join('')||'<div class="muted">暂无。</div>'}catch(e){brief.textContent=e.message}}async function scanChat(){const text=chatText.value.trim();if(!text)return toast('先输入聊天内容');try{let personId=null;if(chatName.value.trim()){const p=await api('/api/social/people/search?q='+encodeURIComponent(chatName.value.trim()));personId=p[0]?.id||null}const c=await api('/api/life-os/conversations',{method:'POST',body:JSON.stringify({title:chatName.value.trim()?`与${chatName.value.trim()}的社交沟通`:'社交沟通',kind:'chat'})});const d=await api('/api/life-os/conversations/'+c.id+'/messages',{method:'POST',body:JSON.stringify({role:'user',content:text})});const a=d.risk_alerts||[];chatResult.innerHTML=a.length?'<div class="card danger"><h3>⚠ 发现需要核验的信号</h3>'+a.map(x=>`<div class="item"><b>${esc(x.category)} · ${esc(x.severity)}</b><div>${esc(x.evidence)}</div><div>建议：${esc(x.advice)}</div></div>`).join('')+'</div>':'<div class="card success"><h3>暂未发现已知风险关键词</h3><div class="muted">这不是安全保证；涉及付款、验证码、远程控制仍应独立核验。</div></div>';chatAdvice.textContent=a.length?'先暂停高风险动作，独立核验身份、收款信息和原始业务来源。':`沟通已记录${personId?'，可以继续进入关系档案查看时间线和评估。':'。建议补充沟通对象姓名以建立长期档案。'}`;briefing();toast('沟通已记录')}catch(e){toast(e.message)}}function initRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){mic.textContent='当前浏览器不支持语音识别，请直接输入。';return null}const r=new SR();r.lang='zh-CN';r.continuous=true;r.interimResults=true;r.onstart=()=>{recording=true;mic.textContent='正在实时转写';};r.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)meetingText+=t+'\n';else it+=t}tx.textContent=meetingText+(it?'\n[实时] '+it:'')};r.onend=()=>{if(recording)try{r.start()}catch(_){}};return r}function toggleMic(){if(!rec)rec=initRec();if(!rec)return;if(recording){recording=false;rec.stop();mic.textContent='已停止'}else{meetingText='';rec.start()}}function clearMeeting(){meetingText='';tx.textContent='点击开始记录。';manual.value='';meetingResult.innerHTML=''}async function saveMeeting(){const text=meetingText.trim()||manual.value.trim();if(!text)return toast('先记录会议内容');try{if(!meetingId){const c=await api('/api/life-os/conversations',{method:'POST',body:JSON.stringify({title:'移动端会议沟通',kind:'meeting'})});meetingId=c.id}await api('/api/life-os/conversations/'+meetingId+'/messages',{method:'POST',body:JSON.stringify({role:'user',content:text})});const n=await api('/api/life-os/conversations/'+meetingId+'/meeting-note',{method:'POST'});meetingResult.innerHTML=`<div class="card"><h3>会议总结</h3><div class="summary">${esc(n.summary)}</div><h4>决策</h4>${(n.decisions||[]).map(x=>`<div class="item">${esc(x)}</div>`).join('')||'<div class="muted">未明确提取。</div>'}<h4>行动项</h4>${(n.actions||[]).map(x=>`<div class="item">${esc(x)}</div>`).join('')||'<div class="muted">未明确提取。</div>'}<h4>风险</h4>${(n.risks||[]).map(x=>`<div class="item danger">${esc(x)}</div>`).join('')||'<div class="muted">暂无。</div>'}<div class="item warn"><b>决策建议</b><div>${(n.risks||[]).length?'先核验关键事实与责任人，再执行。':(n.decisions||[]).length&&(n.actions||[]).length?'把决策转成负责人和截止时间并留档。':'补齐决定、负责人、截止时间和未决问题后再执行。'}</div></div></div>`;briefing();toast('会议总结已生成')}catch(e){toast(e.message)}}async function loadPeople(){try{const q=personQ.value.trim();const rows=await api('/api/social/people/search'+(q?'?q='+encodeURIComponent(q):''));people.innerHTML=rows.map(p=>`<div class="item"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.relationship_type||'unknown')}</div></div><button class="secondary" onclick="profile(${p.id})">关系评估</button></div></div>`).join('')||'<div class="muted">暂无对象。</div>'}catch(e){people.textContent=e.message}}async function profile(id){try{const p=await api('/api/social/people/'+id+'/profile');profile.innerHTML=''}catch(e){}}async function profile(id){try{const p=await api('/api/social/people/'+id+'/profile');document.getElementById('profile').innerHTML=`<div class="card"><h2>${esc(p.person.name)} · 关系档案</h2><div class="grid"><div class="item"><div class="muted">关系信号指数</div><div class="metric">${p.relationship.score}</div><div class="muted">${p.relationship.basis.join('、')}</div></div><div class="item"><div class="muted">关联风险</div><div class="metric">${p.risk_count}</div></div></div><div class="item"><b>关系评估</b><div>${esc(p.relationship.summary)}</div></div><h3>沟通记录</h3>${p.timeline.map(x=>`<div class="item"><div class="muted">${esc(x.event_type)} · ${esc(x.created_at)}</div><div>${esc(x.summary)}</div></div>`).join('')||'<div class="muted">暂无。</div>'}<h3>决策建议</h3><div class="item warn">${esc(p.decision_advice)}</div><button style="width:100%;margin-top:8px" onclick="aiReview(${id})">AI 复盘并生成建议</button></div>`;go('people')}catch(e){toast(e.message)}}async function aiReview(id){try{const p=await api('/api/social/people/'+id+'/profile');const c=await api('/api/life-os/conversations',{method:'POST',body:JSON.stringify({title:'社交对象复盘：'+p.person.name,kind:'social_review'})});const msg=`只根据已记录事实做客观复盘，不猜测人格、动机或身份。输出事实摘要、需要核验、下一步建议、可执行待办。对象：${p.person.name}；关系摘要：${p.relationship.summary}；沟通记录：${p.timeline.map(x=>x.summary).join('\n').slice(-6000)}；风险数：${p.risk_count}`;const d=await api('/api/ai/chat',{method:'POST',body:JSON.stringify({message:msg,conversation_id:c.id,conversation_kind:'social_review'})});document.getElementById('profile').insertAdjacentHTML('beforeend',`<div class="card hero"><h3>AI 社交复盘</h3><div style="white-space:pre-wrap">${esc(d.text)}</div></div>`)}catch(e){toast('AI 复盘不可用：'+e.message)}}function vstore(){try{return JSON.parse(localStorage.getItem('social_voice_profiles')||'{}')}catch(_){return {}}}function renderVoices(){const p=vstore();voices.innerHTML=Object.keys(p).map(n=>`<div class="item"><b>${esc(n)}</b><button class="danger" style="float:right;padding:7px 9px" onclick="delVoice(${JSON.stringify(n)})">删除</button></div>`).join('')||'<div class="muted">暂无。</div>'}function delVoice(n){const p=vstore();delete p[n];localStorage.setItem('social_voice_profiles',JSON.stringify(p));renderVoices()}async function feature(){const s=await navigator.mediaDevices.getUserMedia({audio:true});const c=new(window.AudioContext||window.webkitAudioContext)(),src=c.createMediaStreamSource(s),a=c.createAnalyser();a.fftSize=1024;src.connect(a);const buf=new Float32Array(a.fftSize),f=new Array(24).fill(0);let n=0;await new Promise(done=>{const tick=()=>{a.getFloatTimeDomainData(buf);let en=0;for(const v of buf)en+=v*v;f[0]+=Math.sqrt(en/buf.length);const fr=new Uint8Array(a.frequencyBinCount);a.getByteFrequencyData(fr);for(let i=0;i<23;i++){let z=0;const st=Math.floor(i*fr.length/23),ed=Math.max(st+1,Math.floor((i+1)*fr.length/23));for(let j=st;j<ed;j++)z+=fr[j];f[i+1]+=z/(ed-st)/255}n++;if(n<60)requestAnimationFrame(tick);else done()};tick()});s.getTracks().forEach(x=>x.stop());c.close();return f.map(x=>x/n)}function sim(a,b){let d=0,x=0,y=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];x+=a[i]*a[i];y+=b[i]*b[i]}return d/(Math.sqrt(x)*Math.sqrt(y)||1)}async function enrollVoice(){const n=voiceName.value.trim();if(!n)return toast('先填写授权对象姓名');try{voiceState.textContent='请本人知情同意并朗读短句，正在采集……';const p=vstore();p[n]={feature:await feature()};localStorage.setItem('social_voice_profiles',JSON.stringify(p));renderVoices();voiceState.textContent='已保存本机授权样本。'}catch(e){toast(e.message)}}async function matchVoice(){const p=vstore();if(!Object.keys(p).length)return toast('先录入授权样本');try{voiceState.textContent='正在采集并匹配……';const f=await feature(),r=Object.entries(p).map(([n,v])=>({n,s:sim(f,v.feature)})).sort((a,b)=>b.s-a.s),b=r[0];voiceState.innerHTML=`<b>辅助匹配：${esc(b.n)}</b><div>声音特征相似度约 ${Math.round(b.s*100)}%</div><div class="muted">仅作辅助线索，不能证明身份。</div>`}catch(e){toast('声纹采集失败：'+e.message)}}briefing();renderVoices();</script></body></html>
