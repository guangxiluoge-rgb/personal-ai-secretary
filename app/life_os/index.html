<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Life OS</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f6f8;margin:0;color:#111}main{max-width:1100px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}section{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}textarea,input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;margin:6px 0}button{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer;margin:4px}.danger{border-left:4px solid #d33;padding-left:10px}.muted{color:#666}.item{padding:10px 0;border-top:1px solid #eee}</style></head>
<body><main><h1>AI Life OS</h1><p class="muted">对话记录 · 自动归档 · 会议纪要 · 人际关系 · 防骗提醒</p>
<section><h2>新对话</h2><input id="title" placeholder="对话标题"><select id="kind"><option value="chat">普通对话</option><option value="meeting">会议</option></select><textarea id="message" rows="5" placeholder="输入内容；涉及转账、验证码、联系人或会议内容时会自动归档并检查风险"></textarea><button onclick="send()">发送并归档</button><pre id="result"></pre></section>
<div class="grid"><section><h2>历史对话</h2><div id="conversations"></div></section><section><h2>联系人</h2><div id="people"></div></section><section><h2>风险提醒</h2><div id="risks"></div></section><section><h2>自动归档</h2><div id="archive"></div></section></div>
<section><h2>会议纪要</h2><input id="meetingId" type="number" placeholder="对话 ID"><button onclick="meeting()">生成纪要</button><pre id="meetingResult"></pre></section>
</main><script>
let token=sessionStorage.getItem('health_token')||sessionStorage.getItem('access_token')||'';
const headers=()=>({'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})});
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d}
async function send(){try{let cs=await api('/api/life-os/conversations',{method:'POST',body:JSON.stringify({title:title.value||'新对话',kind:kind.value})});let d=await api('/api/ai/chat',{method:'POST',body:JSON.stringify({message:message.value,conversation_id:cs.id,conversation_kind:kind.value})});result.textContent=JSON.stringify(d,null,2);meetingId.value=cs.id;message.value='';load()}catch(e){result.textContent=e.message}}
async function meeting(){try{meetingResult.textContent=JSON.stringify(await api('/api/life-os/conversations/'+meetingId.value+'/meeting-note',{method:'POST'}),null,2)}catch(e){meetingResult.textContent=e.message}}
async function load(){try{const [c,p,r,a]=await Promise.all([api('/api/life-os/conversations'),api('/api/life-os/people'),api('/api/life-os/risks'),api('/api/life-os/archive')]);conversations.innerHTML=c.map(x=>`<div class=item>#${x.id} ${x.title}<div class=muted>${x.kind}</div></div>`).join('')||'暂无';people.innerHTML=p.map(x=>`<div class=item><b>${x.name}</b><div>${x.relationship_type}</div></div>`).join('')||'暂无';risks.innerHTML=r.map(x=>`<div class="item danger"><b>${x.category} / ${x.severity}</b><div>${x.evidence}</div><div>${x.advice}</div></div>`).join('')||'暂无风险';archive.innerHTML=a.map(x=>`<div class=item><b>${x.title}</b><div>${x.summary}</div></div>`).join('')||'暂无归档'}catch(e){result.textContent=e.message}}
load();
</script></body></html>
