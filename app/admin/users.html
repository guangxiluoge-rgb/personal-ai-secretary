<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Life OS · 用户管理</title><style>body{font-family:system-ui,sans-serif;background:#f6f7f9;margin:0;color:#111}main{max-width:1100px;margin:24px auto;padding:22px;background:#fff;border:1px solid #ddd;border-radius:16px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input,select{padding:9px;border:1px solid #ccc;border-radius:8px}button{padding:9px 13px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer}.item{display:grid;grid-template-columns:70px 1fr 130px 220px;gap:10px;align-items:center;border-top:1px solid #eee;padding:12px 0}.on{color:#137333}.off{color:#b3261e}@media(max-width:800px){.item{grid-template-columns:1fr;gap:5px}}</style></head><body><main><h1>用户管理</h1><p><a href="/admin">← 返回管理后台</a></p><div class="bar"><input id="q" placeholder="按邮箱搜索"><select id="status"><option value="">全部</option><option value="true">启用</option><option value="false">禁用</option></select><button onclick="loadUsers()">搜索</button></div><div id="msg"></div><div id="users"></div><script>const token=sessionStorage.getItem('admin_token')||'';const headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};async function api(u,o={}){const r=await fetch(u,{...o,headers});const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d}async function loadUsers(){try{let u='/api/admin/users?q='+encodeURIComponent(q.value);if(status.value)u+='&is_active='+status.value;const d=await api(u);users.innerHTML=d.items.map(x=>`<div class=item><div>#${x.id}</div><div><b>${x.email}</b><div>${new Date(x.created_at).toLocaleString()}</div></div><div class=${x.is_active?'on':'off'}>${x.is_active?'已启用':'已禁用'}</div><div><button onclick="toggle(${x.id},${x.is_active})">${x.is_active?'禁用':'启用'}</button><button onclick="detail(${x.id})">查看</button></div></div>`).join('')||'暂无用户';msg.textContent='共 '+d.total+' 个用户'}catch(e){msg.textContent=e.message}}async function toggle(id,active){try{await api('/api/admin/users/'+id+'/status',{method:'PATCH',body:JSON.stringify({is_active:!active})});loadUsers()}catch(e){msg.textContent=e.message}}async function detail(id){try{const x=await api('/api/admin/users/'+id);msg.textContent=`用户 #${x.id} · ${x.email} · ${x.is_active?'已启用':'已禁用'} · 注册于 ${new Date(x.created_at).toLocaleString()}`}catch(e){msg.textContent=e.message}}loadUsers();</script></main></body></html>
