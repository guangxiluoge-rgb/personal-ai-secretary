<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>了解我 · 个人画像</title><style>body{margin:0;background:#f4f5f7;color:#171717;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 16px 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.eyebrow{font-size:12px;color:#777;letter-spacing:.08em}.title{font-size:30px;margin:4px 0 8px}.muted{color:#6b7280;line-height:1.6}.card{background:#fff;border:1px solid #e6e7ea;border-radius:20px;padding:20px;margin-top:14px}.progress{height:7px;background:#eceef1;border-radius:99px;overflow:hidden}.bar{height:100%;background:#222;width:0}.q-title{font-size:14px;color:#6b7280}.prompt{font-size:24px;line-height:1.45;margin:10px 0 16px}.answer{width:100%;box-sizing:border-box;min-height:150px;padding:14px;border:1px solid #d7d9dd;border-radius:14px;font:inherit;resize:vertical}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:12px 16px;background:#171717;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#f0f1f3;color:#171717}.btn.danger{background:#fff0f0;color:#b42318}.notice{padding:14px;border-radius:14px;background:#f7f7f7;line-height:1.7}.fact{padding:12px 0;border-bottom:1px solid #eee}.fact:last-child{border-bottom:0}.dim{font-weight:800;margin:18px 0 4px}.pill{font-size:12px;color:#666;background:#f0f1f3;padding:5px 8px;border-radius:99px}.hidden{display:none}</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">PERSONAL PROFILE</div><h1 class="title">慢慢了解你</h1><div class="muted">这不是性格测试，而是一场长期对话。我们会从生活、价值观、关系、经历、未来和内心需要等方向逐步了解你。</div></div><a href="/life-os" class="pill">返回 Life OS</a></div><section id="consent" class="card"><h2>开始前，先说明三件事</h2><div class="notice">你的回答只用于改善这个账号里的个人助理体验。你可以跳过不想回答的问题，也可以随时暂停或清除画像。这里采用的是受阿瑟·阿伦“36个问题”核心思路启发的原创长期访谈，不复制原问题。</div><div class="row" style="margin-top:14px"><button class="btn" onclick="consent(true)">同意并开始</button><button class="btn secondary" onclick="consent(false)">暂不开始</button></div></section><section id="interview" class="card hidden"><div class="row" style="justify-content:space-between"><div id="dimension" class="q-title">—</div><div id="count" class="pill">0 / 36</div></div><div class="progress" style="margin-top:10px"><div id="bar" class="bar"></div></div><h2 id="qtitle" class="q-title" style="margin-top:22px">—</h2><div id="prompt" class="prompt">—</div><textarea id="answer" class="answer" placeholder="写你真实的想法即可，不需要组织得很漂亮。"></textarea><div class="row" style="margin-top:10px"><button class="btn" onclick="submitAnswer()">记录这个回答</button><button class="btn secondary" onclick="loadState()">换一个问题</button><button class="btn secondary" onclick="consent(false)">暂停</button></div><p id="tip" class="muted">回答越具体，后面的服务越容易真正贴合你。涉及隐私的内容可以不写。</p></section><section id="profile" class="card hidden"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">你的个人画像</h2><div id="summary" class="muted"></div></div><button class="btn secondary" onclick="loadProfile()">刷新</button></div><div id="facts"></div><div class="row" style="margin-top:16px"><button class="btn danger" onclick="eraseProfile()">清除画像数据</button></div></section></main><script>const token=sessionStorage.getItem('health_token')||sessionStorage.getItem('access_token')||'';const H=()=>({'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})});async function api(u,o={}){const r=await fetch(u,{...o,headers:{...H(),...(o.headers||{})}});if(r.status===204)return null;const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'请求失败');return d}function show(id,on=true){document.getElementById(id).classList.toggle('hidden',!on)}async function consent(accepted){try{await api('/api/profile/consent',{method:'POST',body:JSON.stringify({accepted})});if(accepted){show('consent',false);show('interview');show('profile');await loadState();await loadProfile()}else{show('interview',false);show('profile',false);show('consent',true)}}catch(e){alert(e.message)}}async function loadState(){try{const d=await api('/api/profile/state');if(d.status!=='active'){show('interview',false);show('consent',true);return}if(!d.question){return}show('interview');const q=d.question;dimension.textContent=q.dimension;count.textContent=`${d.progress.answered} / ${d.progress.total}`;bar.style.width=Math.min(100,d.progress.foundational/d.progress.total*100)+'%';qtitle.textContent=q.title;prompt.textContent=q.prompt;answer.value=''}catch(e){alert(e.message)}}async function submitAnswer(){const text=answer.value.trim();if(text.length<2)return alert('请再多写一点，让我更准确地理解你。');try{const d=await api('/api/profile/answer',{method:'POST',body:JSON.stringify({question_key:getCurrentKey(),answer:text})});if(d.question){setQuestion(d);answer.value='';await loadProfile()}else{await loadState()}}catch(e){alert(e.message)}}let currentKey='';function getCurrentKey(){return currentKey}function setQuestion(d){const q=d.question;if(!q){return}currentKey=q.key;dimension.textContent=q.dimension;count.textContent=`${d.progress.answered} / ${d.progress.total}`;bar.style.width=Math.min(100,d.progress.foundational/d.progress.total*100)+'%';qtitle.textContent=q.title;prompt.textContent=q.prompt}async function init(){try{const d=await api('/api/profile/me');if(d.questionnaire.consent){show('consent',false);show('interview');show('profile');const s=await api('/api/profile/state');if(s.question)setQuestion(s);await renderProfile(d.profile)}else{show('interview',false);show('profile',false)}}catch(e){alert(e.message)}}async function loadProfile(){const d=await api('/api/profile/me');await renderProfile(d.profile)}async function renderProfile(p){summary.textContent=`已沉淀 ${p.answer_count} 次回答。画像会随着后续对话持续更新。`;facts.innerHTML='';for(const [dim,rows] of Object.entries(p.dimensions)){if(!rows.length)continue;const box=document.createElement('div');box.innerHTML=`<div class="dim">${dim}</div>`+rows.map(f=>`<div class="fact"><div class="row"><b>${esc(f.label)}</b><span class="pill">置信度 ${Math.round(f.confidence*100)}%</span></div><div class="muted">${esc(f.statement)}</div></div>`).join('');facts.appendChild(box)}}async function eraseProfile(){if(!confirm('确定清除这个账号的画像、回答和画像记忆吗？'))return;try{await api('/api/profile/me',{method:'DELETE'});alert('已清除');location.reload()}catch(e){alert(e.message)}}function esc(s){return String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}const originalSetQuestion=setQuestion;window.setQuestion=function(d){currentKey=d.question?.key||currentKey;originalSetQuestion(d)}init();</script></body></html>
