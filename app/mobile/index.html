<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f4ef"><title>社交工作台</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#292724;background:#e8e4dc;--paper:#fbfaf7;--ink:#292724;--muted:#77726a;--line:#ddd7cd;--soft:#f1eee8;--accent:#365b4d;--danger:#a43d32;--warn:#9a6a1e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e4dc}button,input,textarea{font:inherit}button{border:1px solid var(--ink);border-radius:10px;padding:11px 13px;background:var(--ink);color:#fff;font-weight:650}button.secondary{background:transparent;color:var(--ink);border-color:var(--line)}button.olive{background:var(--accent);border-color:var(--accent)}button:disabled{opacity:.45}.page{min-height:100dvh;display:grid;place-items:center;padding:18px}.phone{width:min(430px,100vw);aspect-ratio:9/16;max-height:calc(100dvh - 36px);background:var(--paper);border:1px solid #cbc4b9;border-radius:30px;overflow:hidden;box-shadow:0 18px 60px rgba(44,37,29,.16);display:flex;flex-direction:column}.top{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;background:#fbfaf7}.top h1{font-size:20px;margin:0}.top p{font-size:12px;color:var(--muted);margin:4px 0}.screen{display:none;flex:1;overflow:auto;padding:14px 14px 90px}.screen.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}.title{font-size:18px;margin:0 0 5px}.sub{font-size:12px;color:var(--muted);line-height:1.5}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stack{display:grid;gap:8px}.input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}textarea.input{min-height:110px;resize:vertical}.tag{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted);background:var(--soft)}.item{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.list{display:grid;gap:8px}.risk{background:#fff7f5;border-color:#e5b3ac}.ok{background:#f5faf6;border-color:#b9cdbf}.notice{border-left:3px solid var(--warn);padding-left:9px}.metric{font-size:28px;font-weight:750}.bar{height:6px;background:#e6e1d9;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.recbox{background:#20211f;color:#ebe8df;border-radius:14px;padding:12px;min-height:175px;white-space:pre-wrap;line-height:1.6;font-size:13px}.recstate{font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block;margin-right:5px}.bottom{border-top:1px solid var(--line);background:#fbfaf7;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.nav{border:0!important;background:transparent!important;color:var(--muted)!important;padding:7px 2px!important;font-size:10px!important}.nav.active{color:var(--ink)!important}.nav span{display:block;font-size:17px;line-height:18px}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}.thumb img{width:100%;height:100%;object-fit:cover}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#292724;color:#fff;border-radius:999px;padding:9px 13px;font-size:12px;display:none;z-index:20}@media(max-width:700px){.page{padding:0}.phone{width:100vw;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}}
</style></head><body><div class="page"><main class="phone"><header class="top"><div><h1>社交工作台</h1><p id="status">沟通、风险、关系与会议</p></div><span class="tag">个人</span></header>
<section id="home" class="screen active"><div class="card"><div class="sub">今日概览</div><div class="grid2" style="margin-top:8px"><div><div class="metric" id="riskCount">0</div><div class="sub">待处理风险</div></div><div><div class="metric" id="taskCount">0</div><div class="sub">待跟进事项</div></div></div></div><div class="card"><h2 class="title">需要你注意的事</h2><div id="alerts" class="list"><div class="sub">读取中…</div></div></div><div class="grid2"><button onclick="go('chat')">检查对话</button><button class="olive" onclick="go('meeting')">开始记录</button></div><div class="card"><h2 class="title">最近社交对象</h2><div id="peopleHome" class="list"></div></div></section>
<section id="chat" class="screen"><div class="card"><h2 class="title">对话防骗</h2><div class="sub">保存原文，同时检查付款、验证码、远程控制等风险。</div><div class="stack" style="margin-top:10px"><input id="chatPerson" class="input" placeholder="对方姓名（可选）"><textarea id="chatInput" class="input" placeholder="粘贴聊天内容"></textarea><button onclick="checkChat()">检查并保存</button></div></div><div id="chatRisk" class="card" style="display:none"></div><div class="card"><h2 class="title">处理建议</h2><div id="chatAdvice" class="notice sub">还没有检查内容。</div></div></section>
<section id="meeting" class="screen"><div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><h2 class="title">会议记录</h2><div class="sub">录音和实时转写分开控制，停止后再保存。</div></div><div id="recState" class="recstate"><span class="dot"></span>未开始</div></div><div id="transcript" class="recbox" style="margin-top:10px">点击“开始录音”。识别到的文字会持续出现在这里。</div><textarea id="manual" class="input" style="display:none;margin-top:8px" placeholder="浏览器不支持语音识别时，可直接输入内容"></textarea><div class="grid2" style="margin-top:8px"><button id="recordBtn" class="olive" onclick="toggleRecord()">开始录音</button><button class="secondary" onclick="clearRecord()">清空</button></div><div class="grid2" style="margin-top:8px"><button onclick="saveMeeting()">保存并总结</button><button class="secondary" onclick="makeSummary()">重新总结</button></div></div><div id="meetingSummary" class="card" style="display:none"></div></section>
<section id="social" class="screen"><div class="card"><h2 class="title">社交对象</h2><div class="sub">打开一个对象，看沟通记录、关系信号、风险和下一步。</div><div class="stack" style="margin-top:10px"><input id="q" class="input" placeholder="姓名或关系"><button class="secondary" onclick="searchPeople()">搜索</button></div></div><div id="people" class="list"></div><div id="profile" class="card" style="display:none"></div></section>
<nav class="bottom"><button class="nav active" data-s="home" onclick="go('home')"><span>⌂</span>首页</button><button class="nav" data-s="chat" onclick="go('chat')"><span>◌</span>防骗</button><button class="nav" data-s="meeting" onclick="go('meeting')"><span>◉</span>会议</button><button class="nav" data-s="social" onclick="go('social')"><span>♧</span>关系</button></nav><div id="toast" class="toast"></div></main></div>
<script>
const token=sessionStorage.getItem('health_token')||sessionStorage.getItem('access_token')||'';const H=()=>({'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})});let speech=null,media=null,recording=false,finalText='',interim='',meetingId=null,currentPerson=null;
async function api(u,o={}){const r=await fetch(u,{...o,headers:{...H(),...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'请求失败');return d}function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(window.__t);window.__t=setTimeout(()=>e.style.display='none',2200)}function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.s===id));if(id==='social')searchPeople()}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
async function loadHome(){try{const d=await api('/api/social/briefing');riskCount.textContent=d.risk_alerts.length;taskCount.textContent=d.tasks.length;alerts.innerHTML=[...d.risk_alerts.slice(0,3).map(x=>`<div class="item"><strong>${esc(x.category)} · ${esc(x.severity)}</strong><div class="sub">${esc(x.advice)}</div></div>`),...d.relationship_reminders.slice(0,3).map(x=>`<div class="item"><strong>${esc(x.person_name)}</strong><div class="sub">${esc(x.summary)}</div></div>`)].join('')||'<div class="sub">今天没有新的提醒。</div>';const ps=await api('/api/social/people/search');peopleHome.innerHTML=ps.slice(0,4).map(p=>`<button class="secondary" style="text-align:left" onclick="go('social');openPerson(${p.id})"><strong>${esc(p.name)}</strong><span class="sub">${esc(p.relationship_type||'未分类')}</span></button>`).join('')||'<div class="sub">还没有社交记录。</div>'}catch(_){status.textContent='请登录后使用'}}
async function checkChat(){const text=chatInput.value.trim();if(!text)return toast('先粘贴聊天内容');try{const d=await api('/api/social/messages/ingest',{method:'POST',body:JSON.stringify({source:'mobile',sender_name:chatPerson.value.trim(),content:text,person_id:currentPerson})});const a=d.risk_alerts||[];chatRisk.style.display='block';chatRisk.className='card '+(a.length?'risk':'ok');chatRisk.innerHTML=a.length?'<h2 class="title">需要核验</h2>'+a.map(x=>`<div class="item"><strong>${esc(x.category)} · ${esc(x.severity)}</strong><div class="sub">${esc(x.evidence||'')}</div><div class="sub">${esc(x.advice||'')}</div></div>`).join(''):'<h2 class="title">暂未发现已知风险</h2><div class="sub">规则未命中不代表对方一定安全。</div>';chatAdvice.textContent=a.length?a.map(x=>x.advice).join(' '):'涉及付款、验证码或账号操作时，仍建议通过独立渠道核验。';toast(a.length?'发现风险':'已保存');loadHome()}catch(e){toast(e.message)}}
function updateText(){transcript.textContent=(finalText+interim).trim()||'正在等待语音…'}async function startSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){manual.style.display='block';return}const r=new SR();r.lang='zh-CN';r.continuous=true;r.interimResults=true;r.onresult=e=>{interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;e.results[i].isFinal?finalText+=t+'\n':interim+=t}updateText()};r.onerror=()=>{if(recording)toast('语音识别暂时不可用，录音仍继续')};r.onend=()=>{if(recording){try{r.start()}catch(_){}}};r.start();speech=r}
async function startMedia(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return;const s=await navigator.mediaDevices.getUserMedia({audio:true});const r=new MediaRecorder(s);r.onstop=()=>s.getTracks().forEach(t=>t.stop());r.start(250);media=r}
async function toggleRecord(){if(recording){stopRecord();return}try{recording=true;recordBtn.textContent='停止录音';recState.innerHTML='<span class="dot" style="background:#a43d32"></span>录音中 · 转写中';await startMedia();await startSpeech();toast('开始录音')}catch(e){recording=false;recordBtn.textContent='开始录音';recState.innerHTML='<span class="dot"></span>未开始';toast('请允许浏览器使用麦克风')}}function stopRecord(){recording=false;if(speech){try{speech.onend=null;speech.stop()}catch(_){}speech=null}if(media&&media.state!=='inactive'){try{media.stop()}catch(_){}}media=null;if(!finalText.trim()&&manual.value.trim())finalText=manual.value.trim();recordBtn.textContent='开始录音';recState.innerHTML='<span class="dot" style="background:#6c7c6e"></span>已停止';updateText()}function clearRecord(){stopRecord();finalText='';interim='';manual.value='';transcript.textContent='点击“开始录音”。识别到的文字会持续出现在这里。';meetingSummary.style.display='none'}function meetingText(){return(finalText||manual.value).trim()}
async function saveMeeting(){const text=meetingText();if(!text)return toast('还没有会议内容');try{if(!meetingId)meetingId=(await api('/api/life-os/conversations',{method:'POST',body:JSON.stringify({title:'现场会议',kind:'meeting'})})).id;await api('/api/life-os/conversations/'+meetingId+'/messages',{method:'POST',body:JSON.stringify({role:'user',content:text})});await makeSummary();toast('已保存')}catch(e){toast(e.message)}}async function makeSummary(){if(!meetingId)return toast('先保存会议内容');try{const d=await api('/api/life-os/conversations/'+meetingId+'/meeting-note',{method:'POST'});meetingSummary.style.display='block';meetingSummary.innerHTML=`<h2 class="title">会议总结</h2><div class="item"><strong>结论</strong><div class="sub">${esc(d.summary||'暂无')}</div></div><div class="item"><strong>决策</strong><div class="sub">${(d.decisions||[]).map(esc).join('<br>')||'暂无'}</div></div><div class="item"><strong>行动项</strong><div class="sub">${(d.actions||[]).map(esc).join('<br>')||'暂无'}</div></div><div class="item"><strong>风险</strong><div class="sub">${(d.risks||[]).map(esc).join('<br>')||'暂无'}</div></div><div class="notice sub" style="margin-top:8px">建议：执行前确认负责人、截止时间和关键数字。</div>`;toast('总结完成')}catch(e){toast(e.message)}}
async function searchPeople(){try{const ps=await api('/api/social/people/search?q='+encodeURIComponent(q.value.trim()));people.innerHTML=ps.map(p=>`<button class="secondary" style="text-align:left" onclick="openPerson(${p.id})"><strong>${esc(p.name)}</strong><span class="sub">${esc(p.relationship_type||'未分类')} · ${esc(p.importance||'normal')}</span></button>`).join('')||'<div class="sub">没有找到对象。</div>'}catch(e){toast(e.message)}}async function openPerson(id){currentPerson=id;try{const d=await api('/api/social/people/'+id+'/profile');const p=d.person,r=d.relationship,tl=d.timeline||[],tasks=d.tasks||[],risks=d.risks||[],imgs=JSON.parse(localStorage.getItem('social_images_'+id)||'[]');profile.style.display='block';profile.innerHTML=`<h2 class="title">${esc(p.name)}</h2><div class="sub">${esc(p.relationship_type||'未分类')} · ${r.interactions} 次记录</div><div class="bar" style="margin-top:8px"><i style="display:block;width:${Math.min(100,Math.max(0,r.score))}%"></i></div><div class="sub" style="margin-top:5px">关系信号：${esc(r.summary)}</div><div class="item" style="margin-top:8px"><strong>沟通记录</strong><div style="margin-top:7px">${tl.map(x=>`<div style="border-left:2px solid #c9c2b7;padding-left:9px;margin:7px 0"><div class="sub">${esc(x.event_type)} · ${esc(x.occurred_at||'')}</div><div>${esc(x.summary)}</div></div>`).join('')||'<div class="sub">暂无记录</div>'}</div></div><div class="item"><strong>风险</strong><div class="sub">${risks.map(x=>esc(x.category)+' · '+esc(x.severity)+'<br>'+esc(x.advice||'')).join('<br><br>')||'暂无'}</div></div><div class="item"><strong>待跟进</strong><div class="sub">${tasks.map(x=>esc(x.title)).join('<br>')||'暂无'}</div></div><div class="item"><strong>社交图片</strong><input id="imgup" type="file" accept="image/*" multiple hidden><button class="secondary" onclick="imgup.click()">上传图片</button><div id="thumbs" class="thumbs" style="margin-top:8px">${imgs.map((s,i)=>`<div class="thumb"><img src="${s}" alt="图片${i+1}"></div>`).join('')}</div></div><button class="olive" style="width:100%;margin-top:8px" onclick="reviewPerson(${id})">给我下一步建议</button><div id="advice" class="notice sub" style="margin-top:8px">只根据已记录事实和沟通信号给建议。</div>`;imgup.onchange=e=>addImages(e,id)}catch(e){toast(e.message)}}function addImages(e,id){const fs=[...e.target.files].filter(f=>f.type.startsWith('image/')).slice(0,9);Promise.all(fs.map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)}))).then(xs=>{const old=JSON.parse(localStorage.getItem('social_images_'+id)||'[]');localStorage.setItem('social_images_'+id,JSON.stringify(old.concat(xs).slice(-12)));openPerson(id);toast('图片已加入对象档案')})}async function reviewPerson(id){try{const d=await api('/api/social/people/'+id+'/review',{method:'POST',body:JSON.stringify({focus:'沟通、风险、待跟进事项和下一步决策'})});document.getElementById('advice').textContent=d.advice||'暂无建议'}catch(e){document.getElementById('advice').textContent='暂时无法生成建议，请根据沟通记录、风险和待办自行核验。'}}loadHome();
</script></body></html>
