<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社交知青圈</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f6f8;margin:0;color:#111}main{max-width:1200px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}@media(max-width:850px){.grid{grid-template-columns:1fr}}section{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;margin:6px 0}button{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer;margin:4px}.item{padding:10px 0;border-top:1px solid #eee}.muted{color:#666}.selected{border:2px solid #111}.danger{border-left:4px solid #c33;padding-left:10px}.task{border-left:4px solid #555;padding-left:10px}.task.done{opacity:.6}</style></head>
<body><main><h1>社交知青圈</h1><p class="muted">把人物、圈子、话题和互动统一沉淀到你的个人社交知识网络。</p>
<section><h2>创建圈子</h2><input id="circleName" placeholder="例如：老同学、行业朋友、创业伙伴"><textarea id="circleDesc" rows="3" placeholder="这个圈子主要记录什么关系？"></textarea><button onclick="createCircle()">创建圈子</button><pre id="message"></pre></section>
<div class="grid"><section><h2>我的圈子</h2><div id="circles"></div></section><section><h2>AI 主动简报</h2><div id="briefing"></div><button onclick="loadBriefing()">刷新今日简报</button></section><section><h2>圈子详情</h2><div id="circleDetail">请选择一个圈子</div></section><section><h2>人物</h2><input id="personSearch" placeholder="搜索姓名/关系"><button onclick="searchPeople()">搜索</button><div id="people"></div></section></div>
</main><script>
const token=sessionStorage.getItem('health_token')||sessionStorage.getItem('access_token')||''; const headers=()=>({'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})});
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d}
async function createCircle(){try{await api('/api/social/circles',{method:'POST',body:JSON.stringify({name:circleName.value,description:circleDesc.value})});circleName.value='';circleDesc.value='';message.textContent='已创建';loadCircles()}catch(e){message.textContent=e.message}}
async function loadCircles(){try{const d=await api('/api/social/circles');circles.innerHTML=d.map(x=>`<div class=item><button onclick="showCircle(${x.id})">${x.name}</button><span class=muted> ${x.member_count} 人</span><div>${x.description||''}</div></div>`).join('')||'暂无圈子'}catch(e){circles.textContent=e.message}}
async function showCircle(id){try{const d=await api('/api/social/circles/'+id);circleDetail.innerHTML=`<h3>${d.name}</h3><p>${d.description||''}</p><b>成员</b>${d.members.map(x=>`<div class=item>${x.name} · ${x.role} ${x.tags?'· '+x.tags:''}</div>`).join('')||'<div class=muted>暂无成员</div>'}<b>话题</b>${d.topics.map(x=>`<div class=item>${x.title}<div>${x.summary||''}</div></div>`).join('')||'<div class=muted>暂无话题</div>'}<b>近期互动</b>${d.events.map(x=>`<div class=item>${x.event_type} · ${x.summary}</div>`).join('')||'<div class=muted>暂无互动</div>'}`}catch(e){circleDetail.textContent=e.message}}
async function searchPeople(){try{const d=await api('/api/social/people/search?q='+encodeURIComponent(personSearch.value));people.innerHTML=d.map(x=>`<div class=item><b>${x.name}</b><div>${x.relationship_type} · ${x.importance}</div><div>${x.notes||''}</div></div>`).join('')||'暂无'}catch(e){people.textContent=e.message}}
async function completeTask(id){try{await api('/api/social/tasks/'+id+'/complete',{method:'POST'});loadBriefing()}catch(e){briefing.textContent=e.message}}
async function loadBriefing(){try{const d=await api('/api/social/briefing');briefing.innerHTML=`<div class=${d.risk_alerts.length?'danger':''}><b>风险 ${d.risk_alerts.length}</b>${d.risk_alerts.map(x=>`<div class=item>${x.category} · ${x.advice}</div>`).join('')}</div><h3>待办 ${d.tasks.length}</h3>${d.tasks.map(x=>`<div class="item task"><b>${x.title}</b><div>${x.person_name?x.person_name+' · ':''}${x.priority}${x.overdue?' · 已逾期':''}</div><div class=muted>${x.due_at||'未设置截止时间'}</div><button onclick="completeTask(${x.id})">完成</button></div>`).join('')||'<div class=muted>暂无待办</div>'}<h3>关系提醒 ${d.relationship_reminders.length}</h3>${d.relationship_reminders.map(x=>`<div class=item>${x.person_name} · ${x.summary} · ${x.overdue?'已逾期':'待跟进'}</div>`).join('')||'<div class=muted>暂无</div>'}<h3>最近会议</h3>${d.recent_meetings.map(x=>`<div class=item>${x.title}<div>${x.summary}</div></div>`).join('')||'<div class=muted>暂无</div>'}` }catch(e){briefing.textContent=e.message}}
loadCircles();searchPeople();loadBriefing();
</script></body></html>
