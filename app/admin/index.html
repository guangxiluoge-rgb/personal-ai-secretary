<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Life OS · 管理后台</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:1100px;margin:30px auto;padding:0 18px;background:#f6f7f9;color:#111}main{background:#fff;border:1px solid #ddd;border-radius:16px;padding:28px;box-shadow:0 4px 18px #0000000b}h1{margin:0}.sub{color:#666}.section{margin-top:28px}.section h2{font-size:18px}.row{display:grid;grid-template-columns:260px 1fr 100px;gap:12px;align-items:center;border-top:1px solid #eee;padding:14px 0}.key{font-weight:650}.desc{font-size:12px;color:#777;margin-top:4px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}button{padding:10px 16px;border:0;border-radius:8px;background:#111;color:white;cursor:pointer}button:disabled{opacity:.5}.hidden{display:none}.notice{padding:12px;background:#f1f1f1;border-radius:9px;margin:14px 0}.danger{color:#a00}@media(max-width:700px){.row{grid-template-columns:1fr}.row button{width:100%}}</style></head><body><main><h1>AI Life OS 管理后台</h1><p class="sub">所有需要运营方调整的 API、模型、套餐、支付参数集中在这里。敏感值保存后只显示掩码。</p><section id="login"><div class="notice">首次部署：先用服务器环境变量配置管理员账号密码，然后执行一次初始化。</div><input id="email" placeholder="管理员邮箱"><br><br><input id="password" type="password" placeholder="管理员密码"><br><br><button onclick="doLogin()">登录后台</button><p id="loginmsg"></p></section><section id="panel" class="hidden"><div id="msg" class="notice">正在读取配置…</div><div class="section"><h2>AI 服务</h2><div id="ai"></div></div><div class="section"><h2>支付与套餐</h2><div id="billing"></div></div><div class="section"><h2>系统</h2><div id="system"></div></div></section></main><script>let token='';const groups={ai:['antfu_api_url','antfu_api_key','antfu_model'],billing:['stripe_secret_key','stripe_webhook_secret','stripe_price_pro_monthly','stripe_price_health_pro_monthly','stripe_price_premium_monthly','product_pro_monthly_price_minor','product_health_pro_monthly_price_minor','product_premium_monthly_price_minor'],system:['cors_origins']};const labels={antfu_api_url:'蚂蚁阿福 API 地址',antfu_api_key:'蚂蚁阿福 API Key',antfu_model:'蚂蚁阿福模型名',stripe_secret_key:'Stripe Secret Key',stripe_webhook_secret:'Stripe Webhook Secret',stripe_price_pro_monthly:'Pro Stripe Price ID',stripe_price_health_pro_monthly:'Health Pro Stripe Price ID',stripe_price_premium_monthly:'Premium Stripe Price ID',product_pro_monthly_price_minor:'Pro 月费（最小货币单位）',product_health_pro_monthly_price_minor:'Health Pro 月费（最小货币单位）',product_premium_monthly_price_minor:'Premium 月费（最小货币单位）',cors_origins:'前端允许来源'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function doLogin(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let d=await r.json();if(!r.ok){loginmsg.textContent=d.detail||'登录失败';return}token=d.access_token;document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');load()}async function load(){let r=await fetch('/api/admin/settings',{headers:{Authorization:'Bearer '+token}});let d=await r.json();if(!r.ok){msg.textContent=d.detail||'读取失败';return}const by=Object.fromEntries(d.settings.map(x=>[x.key,x]));for(const [group,keys] of Object.entries(groups)){document.getElementById(group).innerHTML=keys.map(k=>{const x=by[k]||{};return `<div class="row"><div><div class="key">${labels[k]||k}</div><div class="desc">${x.is_secret?'敏感配置：保存后不回显':'可随时修改'}</div></div><input id="s_${k}" type="${x.is_secret?'password':'text'}" placeholder="${x.is_secret&&x.value?'已配置，留空不修改':'请输入'}" value="${x.is_secret?'':esc(x.value||'')}"><button onclick="save('${k}')">保存</button></div>`}).join('')}msg.textContent='配置已加载'}async function save(key){const el=document.getElementById('s_'+key);if(!el.value)return;const r=await fetch('/api/admin/settings/'+key,{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({value:el.value})});const d=await r.json();msg.textContent=r.ok?key+' 已保存并进入运行配置':'保存失败：'+(d.detail||'unknown');if(r.ok)load()}</script></body></html>
