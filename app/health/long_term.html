<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长期健康画像</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:14px}.muted{color:#6b7280}.metric{margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}}button{padding:10px 14px;border:0;border-radius:10px;background:#111;color:#fff;cursor:pointer}.token{display:flex;gap:8px}.token input{flex:1;padding:10px;border:1px solid #ccd2da;border-radius:10px}</style></head>
<body><div class="wrap"><h1>长期健康画像</h1><p class="muted">从周报沉淀到月度、季度趋势，观察长期变化与稳定性。</p><div class="card token"><input id="token" type="password" placeholder="访问令牌"><button onclick="loadAll()">加载</button></div><div id="status" class="muted"></div><div class="card"><h2>月度趋势</h2><div id="months" class="grid"></div></div><div class="card"><h2>季度趋势</h2><div id="quarters" class="grid"></div></div></div><script>const t=document.getElementById('token');t.value=sessionStorage.getItem('health_token')||'';function h(){return{Authorization:'Bearer '+t.value.trim()}}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function loadAll(){sessionStorage.setItem('health_token',t.value.trim());document.getElementById('status').textContent='读取长期健康画像…';try{const[a,b]=await Promise.all([fetch('/api/health/long-term/monthly',{headers:h()}),fetch('/api/health/long-term/quarterly',{headers:h()})]);if(!a.ok||!b.ok)throw Error('读取失败');renderPeriods('months',(await a.json()).months,'月');renderPeriods('quarters',(await b.json()).quarters,'季度');document.getElementById('status').textContent='已加载';}catch(e){document.getElementById('status').textContent=e.message}}function renderPeriods(id,items,label){const root=document.getElementById(id);root.innerHTML=items.map(x=>'<div class="item"><b>'+esc(x.period_start)+'</b><div class="muted">报告 '+x.report_count+' 周 · 样本 '+x.sample_count+'</div><div>'+Object.entries(x.risk_counts||{}).map(([k,v])=>'<span>'+esc(k)+': '+esc(v)+' </span>').join('')+'</div><div class="metric">'+(x.metrics||[]).slice(0,8).map(m=>'<div>'+esc(m.name)+'：均值 '+esc(m.average)+' '+esc(m.unit||'')+'，最新 '+esc(m.latest)+'</div>').join('')+'</div></div>').join('')||'<div class="muted">暂无'+label+'数据</div>'}loadAll();</script></body></html>
