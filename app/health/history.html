<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Life OS · 历史健康周报</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e7eaf0;--text:#172033;--muted:#667085;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 16px 48px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.hero h1{margin:0 0 6px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.token{display:flex;gap:8px;flex-wrap:wrap}.token input{flex:1;min-width:260px;padding:10px;border:1px solid #ccd2da;border-radius:10px}button{border:0;border-radius:10px;padding:10px 14px;background:#111;color:#fff;cursor:pointer}button.secondary{background:#e9edf3;color:#111}.muted{color:var(--muted)}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed #cfd5dd;border-radius:12px}.weeks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.week{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff}.week.active{border-color:#2563eb;box-shadow:0 0 0 2px #2563eb18}.trend-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.trend{border:1px solid var(--line);border-radius:12px;padding:14px}.trend h3{margin:0 0 5px;font-size:15px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;background:#eef4ff;color:#1d4ed8}.advice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.advice{border:1px solid var(--line);border-radius:12px;padding:14px}.advice h3{margin:0 0 8px}@media(max-width:760px){.weeks,.trend-grid,.advice-grid{grid-template-columns:1fr}.hero{flex-direction:column}}
</style>
</head>
<body><div class="wrap">
<div class="hero"><div><h1>历史健康周报</h1><div class="muted">回顾历史周报，并比较最近四周的健康参数趋势。</div></div><div class="toolbar"><button onclick="loadHistory()">刷新</button><button class="secondary" onclick="location.href='/health'">返回健康中心</button></div></div>
<div class="card"><div class="token"><input id="token" type="password" placeholder="粘贴当前账号访问令牌"><button onclick="saveToken()">保存并读取</button></div><div class="muted" style="font-size:12px;margin-top:8px">令牌仅保存在当前浏览器会话中。</div></div>
<div id="status" class="card">请输入令牌。</div>
<div class="card"><h2>历史周报</h2><div id="weeks" class="weeks"><div class="empty">暂无历史周报</div></div></div>
<div class="card"><h2>最近四周趋势</h2><div id="trendSummary" class="empty">暂无趋势数据</div><div id="trends" class="trend-grid" style="margin-top:12px"></div></div>
<div class="card"><h2>选中周报</h2><div id="report" class="empty">请选择一周。</div></div>
</div>
<script>
const token=document.getElementById('token'),statusEl=document.getElementById('status'),weeksEl=document.getElementById('weeks'),trendSummary=document.getElementById('trendSummary'),trendsEl=document.getElementById('trends'),reportEl=document.getElementById('report');
token.value=sessionStorage.getItem('health_token')||'';
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const headers=()=>({Authorization:'Bearer '+token.value.trim()});
async function api(path){return fetch(path,{headers:headers()})}
function saveToken(){if(!token.value.trim()){statusEl.textContent='未提供令牌。';return}sessionStorage.setItem('health_token',token.value.trim());loadHistory()}
async function loadHistory(){if(!token.value.trim()){statusEl.textContent='请输入令牌。';return}statusEl.textContent='正在读取历史周报…';try{const [h,t]=await Promise.all([api('/api/health/history?limit=12'),api('/api/health/history/four-weeks')]);if(!h.ok||!t.ok)throw new Error('读取失败');const hd=await h.json(),td=await t.json();renderWeeks(hd.reports||[]);renderTrends(td);statusEl.textContent='历史健康档案已加载。';if((hd.reports||[]).length)loadReport(hd.reports[0].week_start)}catch(e){statusEl.textContent='读取失败：'+e.message}}
function renderWeeks(rows){if(!rows.length){weeksEl.innerHTML='<div class="empty">暂无历史周报。系统完成第一次周度评估后会自动出现在这里。</div>';return}weeksEl.innerHTML=rows.map((r,i)=>'<div class="week '+(i===0?'active':'')+'" data-week="'+esc(r.week_start)+'"><b>'+esc(r.week_start)+'</b><div class="muted" style="font-size:12px;margin-top:5px">更新：'+esc(String(r.updated_at))+'</div></div>').join('');weeksEl.querySelectorAll('.week').forEach(el=>el.onclick=()=>{weeksEl.querySelectorAll('.week').forEach(x=>x.classList.remove('active'));el.classList.add('active');loadReport(el.dataset.week)})}
async function loadReport(week){reportEl.innerHTML='正在读取 '+esc(week)+' 周报…';try{const r=await api('/api/health/history/report?week_start='+encodeURIComponent(week));const d=await r.json();if(!r.ok)throw new Error(d.detail||'读取失败');const p=d.report||{};const rec=p.recommendations||{};const domains=[['diet','饮食'],['rest','休息'],['sleep','睡眠'],['energy','精力'],['emotion','情绪'],['exercise','运动'],['nutrition','营养'],['other','其他健康']];reportEl.innerHTML='<h3>'+esc(p.week_start||week)+' 至 '+esc(p.week_end||'')+'</h3><p>'+esc(p.summary||'本周健康数据周报。')+'</p>'+(Array.isArray(p.evaluation)&&p.evaluation.length?'<h4>评估</h4><ul>'+p.evaluation.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'<div class="advice-grid">'+domains.map(([k,l])=>'<div class="advice"><h3>'+l+'</h3><ul>'+((Array.isArray(rec[k])?rec[k]:[]).map(x=>'<li>'+esc(x)+'</li>').join('')||'<li>暂无该领域建议。</li>')+'</ul></div>').join('')+'</div><p class="muted" style="font-size:12px;margin-top:14px">'+(Array.isArray(p.safety_notes)?p.safety_notes.map(x=>esc(x)).join('；'):'')+'</p>'}catch(e){reportEl.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function renderTrends(data){const weeks=data.weeks||[],metrics=data.metrics||[];trendSummary.innerHTML=weeks.length?'覆盖 '+weeks.length+' 周 · '+weeks.map(w=>esc(w.week_start)).join(' → '):'暂无四周数据';if(!metrics.length){trendsEl.innerHTML='<div class="empty">暂无足够的跨周数值指标。</div>';return}trendsEl.innerHTML=metrics.map(m=>'<div class="trend"><h3>'+esc(m.name)+' <span class="muted">'+esc(m.unit||'')+'</span></h3><div>'+m.points.map(p=>'<span class="badge" style="margin:0 6px 6px 0">'+esc(p.week_start)+' · '+esc(p.average)+'</span>').join('')+'</div><div class="muted" style="font-size:12px;margin-top:6px">四周变化：'+(m.change_pct==null?'不可计算':esc(m.change_pct)+'%')+'</div></div>').join('')}
loadHistory();
</script></body></html>
