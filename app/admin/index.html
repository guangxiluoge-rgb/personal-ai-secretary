<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Life OS · 管理后台</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:980px;margin:40px auto;padding:0 20px;background:#f6f7f9;color:#111}main{background:#fff;border:1px solid #ddd;border-radius:14px;padding:28px;box-shadow:0 4px 18px #0000000b}h1{margin-top:0}.row{display:grid;grid-template-columns:260px 1fr 110px;gap:12px;align-items:center;border-top:1px solid #eee;padding:14px 0}.row:first-child{border-top:0}.key{font-weight:600}.desc{font-size:12px;color:#666}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}button{padding:10px 16px;border:0;border-radius:8px;background:#111;color:white;cursor:pointer}.danger{color:#a00}.hidden{display:none}#msg{margin:12px 0;padding:10px;background:#f1f1f1;border-radius:8px}</style></head><body><main><h1>AI Life OS 管理后台</h1><p>这里统一调整 API、模型、套餐价格与支付配置；敏感值只显示掩码。</p><section id="login"><input id="email" placeholder="管理员邮箱"><br><br><input id="password" type="password" placeholder="管理员密码"><br><br><button onclick="login()">登录后台</button><p id="loginmsg"></p></section><section id="panel" class="hidden"><div id="msg">正在读取配置…</div><div id="settings"></div></section></main><script>let token='';const labels={antfu_api_url:'蚂蚁阿福 API 地址',antfu_api_key:'蚂蚁阿福 API Key',antfu_model:'蚂蚁阿福模型名',stripe_secret_key:'Stripe Secret Key',stripe_webhook_secret:'Stripe Webhook Secret',stripe_price_pro_monthly:'Pro Stripe Price ID',stripe_price_health_pro_monthly:'Health Pro Stripe Price ID',stripe_price_premium_monthly:'Premium Stripe Price ID',product_pro_monthly_price_minor:'Pro 月费（最小货币单位）',product_health_pro_monthly_price_minor:'Health Pro 月费（最小货币单位）',product_premium_monthly_price_minor:'Premium 月费（最小货币单位）',cors_origins:'前端允许来源'};async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let d=await r.json();if(!r.ok){loginmsg.textContent=d.detail||'登录失败';return}token=d.access_token;login.classList.add('hidden');panel.classList.remove('hidden');load()}async function load(){let r=await fetch('/api/admin/settings',{headers:{Authorization:'Bearer '+token}});let d=await r.json();if(!r.ok){msg.textContent=d.detail||'读取失败';return}settings.innerHTML=d.settings.map(x=>`<div class="row"><div><div class="key">${labels[x.key]||x.key}</div><div class="desc">${x.is_secret?'敏感配置：保存后不回显':''}</div></div><input id="s_${x.key}" placeholder="${x.is_secret&&x.value?'已配置（留空不修改）':'请输入'}" value="${x.is_secret?'':x.value||''}"><button onclick="save('${x.key}')">保存</button></div>`).join('');msg.textContent='配置已加载'}async function save(key){let el=document.getElementById('s_'+key);if(el.value==='')return;let r=await fetch('/api/admin/settings/'+key,{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({value:el.value})});let d=await r.json();msg.textContent=r.ok?key+' 已保存':'保存失败：'+(d.detail||'unknown');if(r.ok)load()}</script></body></html>
